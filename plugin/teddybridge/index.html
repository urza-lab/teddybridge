<!doctype html>
<!-- teddybridge als Menüpunkt in TeddyCloud (Plugins-Reiter).
     Adresse unten anpassen (TEDDYBRIDGE_URL), dann den Ordner "teddybridge" nach
     <teddycloud-data>/www/plugins/ kopieren. Siehe README, Abschnitt "TeddyCloud-Plugin". -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teddybridge</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f6f4;--fg:#222;--acc:#2f6fdf}
  @media (prefers-color-scheme:dark){:root{--bg:#1b1c1e;--fg:#eee;--acc:#6b9bff}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:16px;box-sizing:border-box}
  a.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600}
  p{text-align:center;max-width:32em}
</style>
</head>
<body>
<main>
  <p>teddybridge öffnet sich …</p>
  <p><a class="btn" id="go" href="TEDDYBRIDGE_URL" target="_top">teddybridge öffnen</a></p>
  <p><small>Falls nichts passiert: <a id="tab" href="TEDDYBRIDGE_URL" target="_blank" rel="noopener">in neuem Tab öffnen</a></small></p>
</main>
<script>
  // teddybridge lässt sich (Sicherheit) nicht in einen Rahmen einbetten: darum das ganze Fenster umleiten.
  // Manche Browser erlauben das aus einem fremden Rahmen nur nach einem Klick – dann bleibt der Knopf.
  const url = document.getElementById('go').href;
  try { (window.top || window).location.href = url; } catch (e) { /* Knopf benutzen */ }
</script>
</body>
</html>
