<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>teddybridge – Anmelden</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--mut:#6b6b70;--line:#dedcd6;--acc:#d9480f;--err:#c92a2a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#232326;--fg:#ececec;--mut:#9a9aa0;--line:#38383c;--acc:#ff8a4c;--err:#ff8787;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
h1{font-size:20px;margin:0 0 4px}
label{display:grid;gap:4px;color:var(--mut);font-size:14px}
input,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer;margin-top:4px}
.err{color:var(--err);margin:0}
.hint{margin:0;font-size:14px;color:var(--mut)}
.hint a{color:var(--acc)}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>teddybridge</h1>
  <p class="err" id="err" hidden>Benutzer oder Passwort falsch.</p>
  <p class="hint" id="frameHint" hidden>Die Anmeldung klappt in TeddyCloud nicht, weil der Browser das Cookie im Rahmen blockiert (TeddyCloud und teddybridge laufen unter verschiedenen Adressen). <a href="/" target="_top">teddybridge im eigenen Fenster öffnen</a></p>
  <label>Benutzer<input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label>Passwort<input name="password" id="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Anmelden</button>
</form>
<script>
// Im Rahmen (TeddyCloud-Plugin): melden, dass teddybridge geladen ist; das Plugin zeigt dann den Rahmen statt umzuleiten.
if (window.parent !== window) { try { parent.postMessage({teddybridge: 'ready'}, '*'); } catch (e) { /* egal */ } }
if(new URLSearchParams(location.search).has('fehler')) document.getElementById('err').hidden=false;
// Im Rahmen ohne Fehlermeldung wieder hier gelandet: Session-Cookie wurde nicht mitgeschickt (fremde Site, SameSite=Strict).
if (window.parent !== window) {
  try {
    const t = +sessionStorage.getItem('tb_login_try'); sessionStorage.removeItem('tb_login_try');
    if (t && Date.now() - t < 15000 && document.getElementById('err').hidden) document.getElementById('frameHint').hidden = false;
  } catch (e) { /* ohne Speicher kein Hinweis */ }
  document.querySelector('form').addEventListener('submit', () => { try { sessionStorage.setItem('tb_login_try', Date.now()); } catch (e) {} });
}
if(document.documentElement.lang==='en'){
  const EN={'Benutzer oder Passwort falsch.':'Wrong user name or password.',
    'Die Anmeldung klappt in TeddyCloud nicht, weil der Browser das Cookie im Rahmen blockiert (TeddyCloud und teddybridge laufen unter verschiedenen Adressen).':
    'Logging in inside TeddyCloud does not work because the browser blocks the cookie in the frame (TeddyCloud and teddybridge run on different sites).',
    'teddybridge im eigenen Fenster öffnen':'Open teddybridge in its own window',
    'Benutzer':'User','Passwort':'Password','Anmelden':'Log in'};
  const w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for(let n; (n=w.nextNode());){ const k=n.nodeValue.trim(); if(EN[k]) n.nodeValue=n.nodeValue.replace(k, EN[k]); }
  document.title='teddybridge – Log in';
}
</script>
</body>
</html>
