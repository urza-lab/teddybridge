<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>teddybridge – Anmelden</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1d1d1f;--mut:#6b6b70;--line:#dedcd6;--acc:#d9480f;--err:#c92a2a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#232326;--fg:#ececec;--mut:#9a9aa0;--line:#38383c;--acc:#ff8a4c;--err:#ff8787;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
h1{font-size:20px;margin:0 0 4px}
label{display:grid;gap:4px;color:var(--mut);font-size:14px}
input,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer;margin-top:4px}
.err{color:var(--err);margin:0}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <h1>teddybridge</h1>
  <p class="err" id="err" hidden>Benutzer oder Passwort falsch.</p>
  <label>Benutzer<input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label>Passwort<input name="password" id="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Anmelden</button>
</form>
<script>if(new URLSearchParams(location.search).has('fehler')) document.getElementById('err').hidden=false;</script>
</body>
</html>
