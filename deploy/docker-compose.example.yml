# teddybridge as a companion container next to TeddyCloud.
#
# Option A (recommended): add the "teddybridge" service below to TeddyCloud's existing docker-compose.yml.
# Both are then in the same network, and teddybridge reaches TeddyCloud directly by its
# service name (TC_URL=http://teddycloud, no reverse proxy in between).
#
# Option B: a separate compose file that joins TeddyCloud's network (uncomment the "networks" section
# below; look up the network name with `docker network ls`, usually <folder>_default).
#
# Configuration: teddybridge.env next to this file (template: deploy/teddybridge.env.example), mode 600.
# Inside the container at least:  TC_URL=http://teddycloud   (TeddyCloud's service name, internal port 80)

services:
  teddybridge:
    image: ghcr.io/urza-lab/teddybridge:latest
    # build: ./teddybridge          # build it yourself instead (folder with the cloned repo)
    container_name: teddybridge
    restart: unless-stopped
    env_file: ./teddybridge.env
    ports:
      - "8085:8085"                 # only needed if Caddy/the browser is not in the same Docker network
    volumes:
      - teddybridge-tmp:/var/tmp    # work folder (downloads), on disk instead of RAM
      # optional file source (NAS), always read-only; then in the env file: FS_ROOTS=Audiobooks=/nas/audiobooks
      # - /mnt/nas/audiobooks:/nas/audiobooks:ro
    read_only: true                 # image file system read-only
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # depends_on: [teddycloud]      # useful in option A

# Option B:
#    networks: [teddycloud]
#networks:
#  teddycloud:
#    external: true
#    name: teddycloud_default

volumes:
  teddybridge-tmp:
